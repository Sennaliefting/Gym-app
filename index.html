<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Log</title>
<style>
:root{
  --bg:#F3F5F8;--card:#FFFFFF;--card2:#F1F4F8;--line:#E3E7ED;
  --text:#142033;--muted:#6B7689;--accent:#2563EB;--accent-ink:#FFFFFF;
  --accent-soft:rgba(37,99,235,.08);--ok:#2563EB;--ok-soft:rgba(37,99,235,.07);--danger:#D93844;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:28px;margin:10px 0 16px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:32px 4px 10px;font-weight:600}
h3{margin:0;font-size:20px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.title{font-weight:600;font-size:17px}
.note{background:var(--card2);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);margin:8px 0}
.empty{text-align:center;padding:24px 16px}
.empty button{margin-top:12px}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin:4px 0}
.steps li.ok{color:var(--ok)}

button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{opacity:.75}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{background:transparent;border-color:transparent;color:var(--danger)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 4px}
button.block{display:flex;width:100%;padding:14px;margin-top:12px}
button.icon{padding:8px;background:transparent;border-color:transparent;color:var(--muted);line-height:1}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
input::placeholder{color:#A6AEBB}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}

/* lijst */
.list{padding:0;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:15px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .chev{color:var(--muted)}

/* sets tijdens training */
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.set.head{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.set .nr{text-align:center;color:var(--muted);font-weight:600}
.set input{text-align:center;padding:11px 4px}
.check{width:46px;height:44px;padding:0;color:#B4BCC8}
.set.done input{border-color:var(--ok);background:var(--ok-soft)}
.set.done .check{background:var(--ok);border-color:var(--ok);color:#fff}

/* tegels */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.tile .v{font-size:24px;font-weight:700}
.tile .l{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar .track{background:var(--card2);border-radius:6px;height:10px;overflow:hidden}
.bar .fill{background:var(--accent);height:100%;border-radius:6px}
.bar .n{text-align:right;color:var(--muted)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:12px 0 8px}
.seg button{flex:1;background:transparent;border:0;padding:8px 4px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(20,32,51,.1);color:var(--text);font-weight:600}
svg.chart{width:100%;height:auto;display:block}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.li .chev svg{width:18px;height:18px;display:block}

/* navigatie */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:none;border:0;border-radius:0;padding:8px 0 9px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* rusttimer */
#rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:9}
#rest[hidden]{display:none}
#rest .box{width:100%;max-width:608px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(20,32,51,.12)}
#rest .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#rest .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#rest button{padding:8px 12px;font-size:14px;background:var(--card)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,32,51,.32);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open,#confirm.open{display:flex}
#confirm{position:fixed;inset:0;background:rgba(20,32,51,.32);display:none;align-items:flex-end;justify-content:center;z-index:25}
button.dangerbg{background:var(--danger);color:#fff}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){#modal,#confirm{align-items:center}.sheet{border-radius:18px}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:14px;flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.demo-btn{padding:6px 10px;font-size:13px;color:var(--accent);border-color:var(--line);gap:4px;flex:none}
.demo-btn svg.ic{width:14px;height:14px}
.li .demo-btn{padding:6px 8px}
.demo-img{position:relative;margin-top:12px;border-radius:14px;overflow:hidden;background:var(--card2);aspect-ratio:4/3}
.demo-img img{width:100%;height:100%;object-fit:cover;display:block}
.demo-img .dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.demo-img .dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(20,32,51,.15)}
.demo-img .dots span.on{background:var(--accent)}
.demo-img .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:14px}
.mchip{display:inline-block;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:12px 6px 0 0}
.mchip.sec{background:var(--card2);color:var(--muted)}
ol.demo-steps{list-style:none;padding:0;margin:14px 0 0;counter-reset:st}
ol.demo-steps li{counter-increment:st;display:flex;gap:12px;margin:12px 0;line-height:1.45}
ol.demo-steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.pick{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.pick .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none}
.pick .box svg{width:16px;height:16px}
.pick.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick.has{opacity:.45}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main id="main"></main>

<div id="rest" hidden>
  <div class="box">
    <div class="row">
      <div class="grow"><div class="small muted">Rust</div><div class="t">0:00</div></div>
      <button data-act="restAdd">+15 s</button>
      <button data-act="restStop">Stop</button>
    </div>
    <div class="prog"></div>
  </div>
</div>

<nav class="tabs"><div class="in">
  <button data-act="go" data-v="train"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><path d="M2.5 9.5v5M21.5 9.5v5M8 12h8"/></svg>Start</button>
  <button data-act="go" data-v="workouts"><svg viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="4" rx="1"/><path d="M16 4.5h2a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg>Trainingen</button>
  <button data-act="go" data-v="exercises"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Oefeningen</button>
  <button data-act="go" data-v="progress"><svg viewBox="0 0 24 24"><path d="M22 7l-8.5 8.5-5-5L2 17M16 7h6v6"/></svg>Progressie</button>
  <button data-act="go" data-v="more"><svg viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>Meer</button>
</div></nav>

<div id="modal"></div>
<div id="confirm"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>

  "Straight-arm pulldown": ["Straight-Arm_Pulldown", "brede rugspier", "", ["Ga voor de kabel staan met de stang hoog en pak hem op schouderbreedte.", "Buig iets voorover en houd je armen bijna gestrekt.", "Duw de stang in een boog naar je bovenbenen. Adem uit.", "Laat hem rustig terug omhoog gaan tot ooghoogte. Adem in."]],
  "Back extension": ["Hyperextensions_Back_Extensions", "onderrug", "billen, hamstrings", ["Ga in de rugstrekbank liggen met je heupen op het kussen en je voeten vast.", "Kruis je armen voor je borst.", "Buig rustig voorover vanuit je heupen met een rechte rug. Adem in.", "Kom terug omhoog tot je lichaam een rechte lijn vormt, niet verder. Adem uit."]],

/* ---------- hulpjes ---------- */
let uidSeq = 0;
const uid = () => Date.now().toString(36) + (uidSeq++).toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = n => n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
const kg = n => Math.round(n).toLocaleString('nl-NL') + ' kg';
const byName = (a, b) => a.name.localeCompare(b.name, 'nl');
const localISO = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const toDate = iso => new Date(iso + 'T12:00:00');
const mmss = sec => { sec = Math.max(0, sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

function relDate(iso) {
  const days = Math.round((toDate(localISO(Date.now())) - toDate(iso)) / 864e5);
  if (days === 0) return 'vandaag';
  if (days === 1) return 'gisteren';
  if (days < 7) return days + ' dagen geleden';
  return toDate(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
}
const longDate = iso => toDate(iso).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

/* ---------- opslag ---------- */
function fresh() {
  const groups = [], exercises = [];
  Object.entries(LIBRARY).forEach(([g, list]) => {
    const gid = uid();
    groups.push({ id: gid, name: g });
    list.forEach(x => { const [name, note] = Array.isArray(x) ? x : [x, '']; exercises.push({ id: uid(), name, groupId: gid, note, demo: name }); });
  });
  return { version: 1, groups, exercises, workouts: [], sessions: [], active: null, settings: { rest: 90 } };
}
function normalize(d) {
  const f = fresh();
  return { ...f, ...d, settings: { ...f.settings, ...(d.settings || {}) } };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.version) {
      // oefeningen van vóór de voorbeelden: koppelen op naam
      (d.exercises || []).forEach(e => { if (!('demo' in e)) e.demo = DEMOS[e.name] ? e.name : ''; });
      return normalize(d);
    }
  } catch (e) {}
  return fresh();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Opslaan is mislukt'); }
}

let S = load();

try { view = localStorage.getItem(KEY + '_view') || 'train'; } catch (e) {}

const ex = id => S.exercises.find(e => e.id === id);
const grp = id => S.groups.find(g => g.id === id);
const demoOf = e => e && DEMOS[e.demo] ? DEMOS[e.demo] : null;
const demoBtn = e => demoOf(e) ? `<button class="demo-btn" data-act="demo" data-id="${e.id}">${ic('play')}Voorbeeld</button>` : '';
const exName = (id, fallback) => ex(id)?.name || fallback || '(verwijderde oefening)';

/* ---------- berekeningen ---------- */
const e1rm = (w, r) => (w > 0 && r > 0) ? (r === 1 ? w : w * (1 + r / 30)) : 0;
const setTxt = s => s.w > 0 ? fmt(s.w) + ' × ' + s.r : s.r + ' herh.';
const sessionVolume = s => s.entries.reduce((t, e) => t + e.sets.reduce((u, x) => u + x.w * x.r, 0), 0);
const sessionSets = s => s.entries.reduce((t, e) => t + e.sets.length, 0);

function lastSets(exId) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const e = S.sessions[i].entries.find(x => x.exerciseId === exId);
    if (e && e.sets.length) return { date: S.sessions[i].date, sets: e.sets };
  }
  return null;
}
function lastOfWorkout(wid) {
  for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].workoutId === wid) return S.sessions[i];
  return null;
}
function history(exId) {
  return S.sessions.filter(s => s.entries.some(e => e.exerciseId === exId && e.sets.length)).map(s => {
    const sets = s.entries.filter(e => e.exerciseId === exId).flatMap(e => e.sets);
    return {
      date: s.date, sets,
      e1rm: Math.max(...sets.map(x => e1rm(x.w, x.r))),
      weight: Math.max(...sets.map(x => x.w)),
      volume: sets.reduce((t, x) => t + x.w * x.r, 0),
      reps: Math.max(...sets.map(x => x.r)),
    };
  });
}

/* ---------- render ---------- */
function render() {
  const views = { train: vTrain, workouts: vWorkouts, exercises: vExercises, progress: vProgress, more: vMore };
  if (!views[view]) view = 'train';
  document.getElementById('main').innerHTML = views[view]();
  document.querySelectorAll('nav.tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === view);
    const dot = b.querySelector('.dot');
    if (b.dataset.v === 'train' && S.active && !dot) b.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
    if (dot && !S.active) dot.remove();
  });
  tick();
}

  return `<div class="card">

      <input inputmode="decimal" data-e="${i}" data-s="${j}" data-f="w" value="${esc(s.w)}" placeholder="${esc(s.pw)}">
      <input inputmode="numeric" data-e="${i}" data-s="${j}" data-f="r" value="${esc(s.r)}" placeholder="${esc(s.pr)}">

    <div class="row" style="margin-top:6px"><button class="ghost" data-act="addSet" data-e="${i}">${ic('plus')}Set</button><span class="grow"></span>
      ${en.sets.length ? `<button class="ghost" style="color:var(--muted)" data-act="delSet" data-e="${i}">${ic('minus')}Laatste set</button>` : ''}</div>
  </div>`;

function newEntry(exId, targetSets, targetReps) {
  const last = lastSets(exId);
  const n = targetSets || last?.sets.length || 3;
  const sets = [];
  for (let i = 0; i < n; i++) {
    const p = last ? last.sets[Math.min(i, last.sets.length - 1)] : null;
    sets.push({ w: '', r: '', pw: p && p.w > 0 ? fmt(p.w) : '', pr: p ? String(p.r) : String(targetReps || ''), done: false });
  }
  return { exerciseId: exId, name: ex(exId)?.name || '', target: targetSets ? { sets: targetSets, reps: targetReps || '?' } : null, sets };
}

/* ---- Progressie ---- */
function vProgress() {
  let h = '<h1>Progressie</h1>';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const monday = new Date(today); monday.setDate(today.getDate() - (today.getDay() + 6) % 7);
  const wk = localISO(monday.getTime()), mo = localISO(new Date(today.getFullYear(), today.getMonth(), 1).getTime());
  h += `<div class="tiles">
    <div class="tile"><div class="v">${S.sessions.filter(s => s.date >= wk).length}</div><div class="l">Deze week</div></div>
    <div class="tile"><div class="v">${S.sessions.filter(s => s.date >= mo).length}</div><div class="l">Deze maand</div></div>
    <div class="tile"><div class="v">${S.sessions.length}</div><div class="l">Totaal</div></div></div>`;

  const cutoff = localISO(Date.now() - 6 * 864e5);
  const per = {};
  S.sessions.filter(s => s.date >= cutoff).forEach(s => s.entries.forEach(e => {
    const g = grp(ex(e.exerciseId)?.groupId)?.name || 'Overig';
    per[g] = (per[g] || 0) + e.sets.length;
  }));
  const rows = Object.entries(per).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  h += '<h2>Sets per spiergroep · laatste 7 dagen</h2><div class="card">' + (rows.length
    ? rows.map(([g, n]) => `<div class="bar"><span>${esc(g)}</span><div class="track"><div class="fill" style="width:${n / max * 100}%"></div></div><span class="n">${n}</span></div>`).join('')
    : '<div class="muted small">Nog geen trainingen deze week.</div>') + '</div>';

  const trained = S.exercises.filter(e => lastSets(e.id));
  h += '<h2>Per oefening</h2>';
  if (!trained.length) return h + '<div class="card empty muted">Rond je eerste training af om hier je progressie te zien.</div>';
  if (!trained.some(e => e.id === ui.progressEx)) {
    const lastS = S.sessions[S.sessions.length - 1];
    ui.progressEx = lastS?.entries.find(en => ex(en.exerciseId))?.exerciseId || trained[0].id;
  }
  h += '<select data-pick-ex>' + S.groups.map(g => {
    const list = trained.filter(e => e.groupId === g.id).sort(byName);
    return list.length ? `<optgroup label="${esc(g.name)}">${list.map(e => `<option value="${e.id}"${e.id === ui.progressEx ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</optgroup>` : '';
  }).join('') + trained.filter(e => !grp(e.groupId)).map(e => `<option value="${e.id}"${e.id === ui.progressEx ? ' selected' : ''}>${esc(e.name)}</option>`).join('') + '</select>';

  const hist = history(ui.progressEx);
  const bestW = hist.reduce((b, x) => x.weight > b ? x.weight : b, 0);
  const best1 = Math.max(...hist.map(x => x.e1rm));
  const bestR = Math.max(...hist.map(x => x.reps));
  const bodyweight = bestW === 0;
  if (bodyweight && (ui.metric === 'e1rm' || ui.metric === 'weight')) ui.metric = 'reps';
  h += `<div class="tiles two" style="margin-top:10px">
    ${bodyweight
      ? `<div class="tile"><div class="v">${bestR}</div><div class="l">Meeste herhalingen</div></div>`
      : `<div class="tile"><div class="v">${fmt(bestW)} kg</div><div class="l">Zwaarste gewicht</div></div>
         <div class="tile"><div class="v">${fmt(Math.round(best1 * 2) / 2)} kg</div><div class="l">Geschat max. (1 herh.)</div></div>`}
    <div class="tile"><div class="v">${hist.length}×</div><div class="l">Getraind</div></div>
    <div class="tile"><div class="v">${relDate(hist[hist.length - 1].date)}</div><div class="l">Laatst</div></div></div>`;

  const metrics = bodyweight ? [['reps', 'Herhalingen'], ['volume', 'Volume']] : [['e1rm', 'Geschat max'], ['weight', 'Gewicht'], ['volume', 'Volume'], ['reps', 'Herh.']];
  h += '<div class="seg">' + metrics.map(([k, l]) => `<button class="${ui.metric === k ? 'on' : ''}" data-act="metric" data-m="${k}">${l}</button>`).join('') + '</div>';
  h += '<div class="card">' + chartSvg(hist.map(x => ({ t: toDate(x.date).getTime(), v: x[ui.metric] })), ui.metric === 'reps' ? '' : ' kg') + '</div>';

  h += '<h2>Geschiedenis</h2><div class="card list">' + hist.slice(-15).reverse().map(x =>
    `<div class="li" style="cursor:default"><div class="grow"><div class="small muted">${relDate(x.date)}</div><div>${x.sets.map(setTxt).join(', ')}</div></div></div>`).join('') + '</div>';
  return h;
}

function chartSvg(pts, unit) {
  if (pts.length < 2) return '<div class="muted small">Na twee trainingen met deze oefening zie je hier een grafiek.</div>';
  const W = 340, H = 190, pl = 40, pr = 12, pt = 12, pb = 26;
  let x0 = Math.min(...pts.map(p => p.t)), x1 = Math.max(...pts.map(p => p.t));
  if (x1 === x0) x1 = x0 + 1;
  let y0 = Math.min(...pts.map(p => p.v)), y1 = Math.max(...pts.map(p => p.v));
  const pad = (y1 - y0) * 0.2 || Math.max(1, y1 * 0.1);
  y0 = Math.max(0, y0 - pad); y1 += pad;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = y0 + (y1 - y0) * i / 3, y = Y(v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v).toLocaleString('nl-NL')}</text>`;
  }
  const dl = t => new Date(t).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  g += `<text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)">${dl(x0)}</text>
    <text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${dl(x1)}</text>`;
  const line = pts.map(p => X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
  const area = `${X(pts[0].t)},${H - pb} ${line} ${X(pts[pts.length - 1].t)},${H - pb}`;
  const lp = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${g}<polygon points="${area}" fill="url(#ga)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${Math.min(X(lp.t), W - pr)}" y="${Math.max(Y(lp.v) - 10, 11)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--text)">${fmt(Math.round(lp.v * 10) / 10)}${unit}</text>
  </svg>`;
}

/* ---------- modal & toast ---------- */
const modal = document.getElementById('modal');
function openModal(html) { modal.innerHTML = '<div class="sheet">' + html + '</div>'; modal.classList.add('open'); }
function closeModal() { modal.classList.remove('open'); modal.innerHTML = ''; picker = null; clearInterval(demoTimer); }
let demoTimer;
function showDemo(e) {
  const [dir, primary, secondary, steps] = demoOf(e);
  const src = f => DEMO_IMG + dir + '/' + f + '.jpg';
  openModal(modalHead(e.name) + `
    <div class="demo-img"><img id="demoImg" src="${src(0)}" alt="Voorbeeld ${esc(e.name)}">
      <div class="dots"><span class="on"></span><span></span></div></div>
    <span class="mchip">${esc(primary.charAt(0).toUpperCase() + primary.slice(1))}</span>${secondary ? `<span class="mchip sec">ook: ${esc(secondary)}</span>` : ''}
    <ol class="demo-steps">${steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>`);
  const img = document.getElementById('demoImg');
  img.onerror = () => {
    clearInterval(demoTimer);
    img.parentElement.innerHTML = '<div class="off">Foto\'s konden niet laden. Heb je internet? Na één keer bekijken werken ze ook offline.</div>';
  };
  new Image().src = src(1);
  let f = 0;
  clearInterval(demoTimer);
  demoTimer = setInterval(() => {
    f = 1 - f; img.src = src(f);
    img.parentElement.querySelectorAll('.dots span').forEach((d, i) => d.classList.toggle('on', i === f));
  }, 1100);
}
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function ask(msg, okLabel = 'Ja', danger = true) {
  const box = document.getElementById('confirm');
  box.innerHTML = `<div class="sheet"><p style="white-space:pre-line;margin-bottom:6px">${esc(msg)}</p>
    <button class="block ${danger ? 'primary dangerbg' : 'primary'}" id="cfOk">${esc(okLabel)}</button>
    <button class="block" id="cfNo">Terug</button></div>`;
  box.classList.add('open');
  return new Promise(res => {
    const done = v => { box.classList.remove('open'); box.innerHTML = ''; res(v); };
    document.getElementById('cfOk').onclick = () => done(true);
    document.getElementById('cfNo').onclick = () => done(false);
    box.onclick = e => { if (e.target === box) done(false); };
  });
}
const modalHead = title => `<div class="row" style="margin-bottom:6px"><h3 class="grow">${esc(title)}</h3><button class="icon" data-act="close" aria-label="Sluiten">${ic('x')}</button></div>`;

function askName(title, value, onSave) {
  openModal(modalHead(title) + `<input id="askInput" value="${esc(value)}" placeholder="Naam"><button class="block primary" id="askSave">Opslaan</button>`);
  const inp = document.getElementById('askInput');
  const go = () => { const v = inp.value.trim(); if (!v) return toast('Vul een naam in'); closeModal(); onSave(v); };
  document.getElementById('askSave').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => inp.focus(), 50);
}

    <label>Notitie (optioneel)</label><textarea id="fxNote" placeholder="bv. stoel stand 4, smalle grip">${esc(e?.note)}</textarea>
    <button class="block primary" id="fxSave">Opslaan</button>
    ${e ? '<button class="block danger" id="fxDel">Oefening verwijderen</button>' : ''}`);
  if (!e) setTimeout(() => document.getElementById('fxName').focus(), 50);
  document.getElementById('fxSave').onclick = () => {

    ui.lastGroup = groupId;
    let target = e;
    if (e) Object.assign(e, { name, groupId, note });
    else { target = { id: uid(), name, groupId, note }; S.exercises.push(target); }
    save(); closeModal(); render();
    toast(e ? 'Opgeslagen' : 'Oefening toegevoegd');
    if (after) after(target.id);
  };
  if (e) document.getElementById('fxDel').onclick = async () => {
    if (!await ask(`"${e.name}" verwijderen? Hij verdwijnt ook uit je eigen trainingen. Je trainingsgeschiedenis blijft bewaard.`)) return;
    S.exercises = S.exercises.filter(x => x.id !== e.id);
    S.workouts.forEach(w => { w.items = w.items.filter(it => it.exerciseId !== e.id); });
    save(); closeModal(); render();
  };
}

/* ---- spiergroepen ---- */
function groupsModal() {
  openModal(modalHead('Spiergroepen') + S.groups.map(g => {
    const n = S.exercises.filter(e => e.groupId === g.id).length;
    return `<div class="row" style="margin-top:8px"><input class="grow" data-gname="${g.id}" value="${esc(g.name)}">
      <button class="icon" data-act="moveGroup" data-id="${g.id}" data-d="-1" aria-label="Omhoog">${ic('up')}</button>
      <button class="icon" data-act="delGroup" data-id="${g.id}" aria-label="Verwijderen">${ic('x')}</button></div>`;
  }).join('') + `<div class="row" style="margin-top:16px"><input class="grow" id="newGroup" placeholder="Nieuwe spiergroep"><button class="primary" data-act="addGroup">Toevoegen</button></div>`);
}

/* ---- oefeningen kiezen ---- */
let picker = null;
function openPicker(title, existing, onDone) {
  picker = { title, existing: new Set(existing), sel: new Set(), q: '', g: '', onDone };
  showPicker();
}
function showPicker() {
  openModal(modalHead(picker.title) + `
    <input id="pickQ" placeholder="Zoeken…" value="${esc(picker.q)}" style="margin:6px 0 4px">
    <div id="pickChips"></div><div id="pickList"></div>
    <button class="block" data-act="pickNew">${ic('plus')}Nieuwe oefening maken</button>
    <button class="block primary" data-act="pickDone" id="pickBtn"></button>`);
  document.getElementById('pickQ').oninput = e => { picker.q = e.target.value; pickList(); };
  pickList();
}
function pickList() {
  const q = picker.q.trim().toLowerCase();
  const list = S.exercises.filter(e => !q || e.name.toLowerCase().includes(q));
  let h = '';
  const groups = picker.g ? [grp(picker.g)] : [...S.groups, { id: null, name: 'Overig' }];
  document.getElementById('pickChips').innerHTML = chips(picker.g, 'pickGroup');
  groups.forEach(g => {
    const items = list.filter(e => g.id ? e.groupId === g.id : !grp(e.groupId)).sort(byName);
    if (!items.length) return;
    h += `<h2 style="margin:16px 0 4px">${esc(g.name)}</h2>` + items.map(e => `<div class="pick${picker.sel.has(e.id) ? ' on' : ''}${picker.existing.has(e.id) ? ' has' : ''}" data-act="pickToggle" data-id="${e.id}">
      <span class="box">${picker.sel.has(e.id) ? ic('check') : ''}</span><span class="grow">${esc(e.name)}</span>${picker.existing.has(e.id) ? '<span class="small muted">staat er al in</span>' : ''}</div>`).join('');
  });
  if (!h) h = `<div class="muted small" style="padding:16px 4px">${S.exercises.length ? 'Niets gevonden.' : 'Je hebt nog geen oefeningen. Maak er hieronder een.'}</div>`;
  document.getElementById('pickList').innerHTML = h;
  const n = picker.sel.size;
  document.getElementById('pickBtn').textContent = n ? `${n} toevoegen` : 'Kies oefeningen';
}

/* ---------- acties ---------- */
const A = {
  go(d) { view = d.v; ui.workoutId = null; try { localStorage.setItem(KEY + '_view', view); } catch (e) {} render(); scrollTo(0, 0); },
  close: closeModal,

  start(d) {
    if (S.active) { view = 'train'; render(); return toast('Er loopt al een training'); }
    const w = S.workouts.find(x => x.id === d.id);
    S.active = {
      id: uid(), workoutId: w?.id || null, name: w?.name || 'Vrije training', startedAt: Date.now(),
      entries: (w?.items || []).filter(it => ex(it.exerciseId)).map(it => newEntry(it.exerciseId, num(it.sets), it.reps)),
    };
    save(); view = 'train'; ui.workoutId = null; render(); scrollTo(0, 0);
  },
  toggleSet(d) {
    const s = S.active.entries[+d.e].sets[+d.s];
    if (!s.done) {
      if (s.w === '' && s.pw !== '') s.w = s.pw;
      if (s.r === '' && num(s.pr) != null) s.r = String(num(s.pr));
      if (!(num(s.r) > 0)) return toast('Vul eerst het aantal herhalingen in');
      s.done = true; startRest();
    } else s.done = false;
    save(); render();
  },
  addSet(d) {
    const en = S.active.entries[+d.e], p = en.sets[en.sets.length - 1];
    en.sets.push({ w: '', r: '', pw: p ? (p.w || p.pw) : '', pr: p ? (p.r || p.pr) : '', done: false });
    save(); render();
  },
  delSet(d) { S.active.entries[+d.e].sets.pop(); save(); render(); },
  entryMenu(d) {
    const i = +d.e, en = S.active.entries[i];
    openModal(modalHead(exName(en.exerciseId, en.name)) + `
      ${i > 0 ? `<button class="block" data-act="moveEntry" data-e="${i}" data-d="-1">${ic('up')}Naar boven</button>` : ''}
      ${i < S.active.entries.length - 1 ? `<button class="block" data-act="moveEntry" data-e="${i}" data-d="1">${ic('down')}Naar beneden</button>` : ''}
      <button class="block danger" data-act="delEntry" data-e="${i}">Uit deze training halen</button>`);
  },
  moveEntry(d) {
    const a = S.active.entries, i = +d.e, j = i + +d.d;
    [a[i], a[j]] = [a[j], a[i]]; save(); closeModal(); render();
  },
  delEntry(d) { S.active.entries.splice(+d.e, 1); save(); closeModal(); render(); },
  addToSession() {
    openPicker('Oefening toevoegen', S.active.entries.map(e => e.exerciseId), ids => {
      ids.forEach(id => S.active.entries.push(newEntry(id))); save(); render();
    });
  },
  async finish() {
    const a = S.active;
    const entries = a.entries.map(en => ({
      exerciseId: en.exerciseId, name: exName(en.exerciseId, en.name),
      sets: en.sets.filter(s => s.done).map(s => ({ w: num(s.w) || 0, r: num(s.r) || 0 })),
    })).filter(en => en.sets.length);
    const open = a.entries.reduce((t, en) => t + en.sets.filter(s => !s.done).length, 0);
    if (!entries.length) {
      if (await ask('Je hebt nog geen sets afgevinkt. Training weggooien?')) { S.active = null; restEnd = 0; save(); render(); }
      return;
    }
    if (open && !await ask(`${open} set${open === 1 ? ' is' : 's zijn'} niet afgevinkt en ${open === 1 ? 'wordt' : 'worden'} niet opgeslagen. Toch afronden?`)) return;
    const session = { id: a.id, workoutId: a.workoutId, name: a.name, date: localISO(a.startedAt), startedAt: a.startedAt, finishedAt: Date.now(), entries };
    S.sessions.push(session);
    S.sessions.sort((x, y) => x.startedAt - y.startedAt);
    S.active = null; restEnd = 0;
    save(); render(); scrollTo(0, 0);
    toast(`Lekker bezig! ${sessionSets(session)} sets · ${kg(sessionVolume(session))}`);
  },
  async cancelSession() {
    if (!await ask('Training annuleren? Wat je hebt ingevuld wordt niet opgeslagen.', 'Ja, training stoppen')) return;
    S.active = null; restEnd = 0; save(); render();
  },
  session(d) {
    const s = S.sessions.find(x => x.id === d.id);
    const mins = Math.round((s.finishedAt - s.startedAt) / 60000);
    openModal(modalHead(s.name) + `<div class="muted small">${longDate(s.date)} · ${mins} min · ${kg(sessionVolume(s))}</div>` +
      s.entries.map(e => `<div class="card" style="background:var(--card2);margin-top:10px"><div style="font-weight:600">${esc(exName(e.exerciseId, e.name))}</div>
        <div class="muted small">${e.sets.map(setTxt).join(', ')}</div></div>`).join('') +
      `<button class="block danger" data-act="delSession" data-id="${s.id}">Uit geschiedenis verwijderen</button>`);
  },
  async delSession(d) {
    if (!await ask('Deze training uit je geschiedenis verwijderen?')) return;
    S.sessions = S.sessions.filter(x => x.id !== d.id); save(); closeModal(); render();
  },
  restAdd() { restEnd = Math.max(restEnd, Date.now()) + 15000; restTotal += 15; tick(); },
  restStop() { restEnd = 0; tick(); },

  newWorkout() {
    askName('Nieuwe training', '', name => {
      const w = { id: uid(), name, items: [] };
      S.workouts.push(w); save(); ui.workoutId = w.id; render();
    });
  },
  editWorkout(d) { ui.workoutId = d.id; render(); scrollTo(0, 0); },
  backWorkouts() { ui.workoutId = null; render(); },
  moveItem(d) {
    const w = S.workouts.find(x => x.id === ui.workoutId), i = +d.i, j = i + +d.d;
    if (j < 0 || j >= w.items.length) return;
    [w.items[i], w.items[j]] = [w.items[j], w.items[i]]; save(); render();
  },
  delItem(d) { const w = S.workouts.find(x => x.id === ui.workoutId); w.items.splice(+d.i, 1); save(); render(); },
  addToWorkout() {
    const w = S.workouts.find(x => x.id === ui.workoutId);
    openPicker('Oefeningen toevoegen', w.items.map(it => it.exerciseId), ids => {
      ids.forEach(id => w.items.push({ exerciseId: id, sets: 3, reps: '8-10' })); save(); render();
    });
  },
  async delWorkout() {
    const w = S.workouts.find(x => x.id === ui.workoutId);
    if (!await ask(`Training "${w.name}" verwijderen? Je gelogde trainingen blijven bewaard.`)) return;
    S.workouts = S.workouts.filter(x => x.id !== w.id); ui.workoutId = null; save(); render();
  },

  newExercise() { exerciseForm(null); },
  demo(d) { showDemo(ex(d.id)); },
  editExercise(d) { exerciseForm(d.id); },
  manageGroups: groupsModal,
  addGroup() {
    const inp = document.getElementById('newGroup'), name = inp.value.trim();
    if (!name) return toast('Vul een naam in');
    S.groups.push({ id: uid(), name }); save(); groupsModal(); render();
  },
  delGroup(d) {
    const g = grp(d.id), n = S.exercises.filter(e => e.groupId === d.id).length;
    if (n) return toast(`Er ${n === 1 ? 'hoort nog 1 oefening' : 'horen nog ' + n + ' oefeningen'} bij ${g.name}`);
    S.groups = S.groups.filter(x => x.id !== d.id); save(); groupsModal(); render();
  },
  moveGroup(d) {
    const i = S.groups.findIndex(g => g.id === d.id);
    if (i <= 0) return;
    [S.groups[i - 1], S.groups[i]] = [S.groups[i], S.groups[i - 1]]; save(); groupsModal(); render();
  },

  pickGroup(d) { picker.g = d.id; pickList(); },
  exGroup(d) { ui.exGroup = d.id; render(); },
  pickToggle(d) { picker.sel.has(d.id) ? picker.sel.delete(d.id) : picker.sel.add(d.id); pickList(); },
  pickNew() {
    const p = picker;
    if (p.g) ui.lastGroup = p.g;
    exerciseForm(null, id => { picker = p; picker.sel.add(id); showPicker(); });
  },
  pickDone() {
    if (!picker.sel.size) return toast('Tik op een of meer oefeningen');
    const ids = [...picker.sel], cb = picker.onDone;
    closeModal(); cb(ids);
  },

  metric(d) { ui.metric = d.m; render(); },

  async export() {
    const json = JSON.stringify({ ...S, exportedAt: new Date().toISOString() }, null, 1);
    const name = 'gymlog-backup-' + localISO(Date.now()) + '.json';
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Gym Log back-up' }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Back-up gedownload');
  },
  import() { document.getElementById('importFile').click(); },
  async reset() {
    if (!await ask('Echt ALLES wissen? Oefeningen, trainingen en je hele geschiedenis. Dit kan niet ongedaan worden.')) return;
    if (!await ask('Laatste kans: heb je een back-up? Alles wordt nu gewist.')) return;
    S = fresh(); restEnd = 0; save(); render(); toast('Alles is gewist');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  e.preventDefault();
  A[el.dataset.act](el.dataset, el);
});

// invoer tijdens de training: direct bewaren, zonder opnieuw te tekenen (dan blijft het toetsenbord open)
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.active) {
    const s = S.active.entries[+t.dataset.e]?.sets[+t.dataset.s];
    if (s) { s[t.dataset.f] = t.value; save(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if ('wname' in d) {
    const w = S.workouts.find(x => x.id === ui.workoutId);
    if (w && t.value.trim()) { w.name = t.value.trim(); save(); }
  } else if (d.wi != null) {
    const w = S.workouts.find(x => x.id === ui.workoutId);
    const it = w?.items[+d.wi];
    if (it) { it[d.wf] = d.wf === 'sets' ? (Math.max(1, Math.round(num(t.value) || 1))) : t.value.trim(); save(); }
  } else if (d.gname) {
    const g = grp(d.gname);
    if (g && t.value.trim()) { g.name = t.value.trim(); save(); render(); }
  } else if (d.setting === 'rest') {
    S.settings.rest = Math.max(10, Math.round(num(t.value) || 90)); t.value = S.settings.rest; save();
  } else if ('pickEx' in d) {
    ui.progressEx = t.value; render();
  }
});

document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.exercises) || !Array.isArray(d.groups) || !Array.isArray(d.sessions)) throw new Error('geen back-up');
    const msg = `Back-up met ${d.exercises.length} oefeningen, ${(d.workouts || []).length} eigen trainingen en ${d.sessions.length} gelogde trainingen.\n\nDit vervangt alles wat nu op dit apparaat staat. Doorgaan?`;
    if (!await ask(msg)) return;
    delete d.exportedAt;
    S = normalize(d); save(); render(); toast('Back-up teruggezet');
  } catch (err) { toast('Dit bestand is geen geldige back-up'); }
});

/* ---------- timers ---------- */
let restEnd = 0, restTotal = 90;
function startRest() { restTotal = S.settings.rest; restEnd = Date.now() + restTotal * 1000; tick(); }
function tick() {
  const box = document.getElementById('rest');
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if (restEnd && left > 0) {
    box.hidden = false;
    box.querySelector('.t').textContent = mmss(left);
    box.querySelector('.prog').style.width = Math.min(100, left / restTotal * 100) + '%';
  } else {
    if (restEnd) { restEnd = 0; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); toast('Rust voorbij, volgende set!'); }
    box.hidden = true;
  }
  document.body.classList.toggle('resting', !box.hidden);
  const el = document.getElementById('elapsed');
  if (el && S.active) el.textContent = mmss(Math.floor((Date.now() - S.active.startedAt) / 1000));
}
setInterval(tick, 500);

render();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
